<g id="bf-inputgap" class="node warning" transform="translate(1240 310)" data-node-type="warning"><title>缺输入、解析失败或事实冲突 — 保留原件；不猜测；输出缺口清单</title><rect class="node-shape" fill="#FFF0F0" stroke="#E06B6B" stroke-width="1.8" x="-125" y="-52" width="250" height="104" rx="10"/><text class="node-title" fill="#132238" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle"><tspan x="0" y="-7.5">缺输入、解析失败或事实冲突</tspan></text><text class="node-stage" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="0" y="22.5">保留原件；不猜测；输出缺口清单</tspan></text></g>
<g id="bf-stageonly" class="node warning" transform="translate(1240 710)" data-node-type="warning"><title>仅需单阶段或上游不齐 — 交付当前可用结果；必要时再询问</title><rect class="node-shape" fill="#FFF0F0" stroke="#E06B6B" stroke-width="1.8" x="-125" y="-52" width="250" height="104" rx="10"/><text class="node-title" fill="#132238" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle"><tspan x="0" y="-7.5">仅需单阶段或上游不齐</tspan></text><text class="node-stage" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="0" y="22.5">交付当前可用结果；必要时再询问</tspan></text></g>
<g id="bf-hard" class="node decision" transform="translate(920 710)" data-node-type="decision"><title>硬约束不满足或未知？ — 不能用综合匹配分抵消</title><polygon class="node-shape" fill="#FFF2CC" stroke="#D6A64F" stroke-width="1.8" points="0,-62 120,0 0,62 -120,0"/><text class="node-title" fill="#132238" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle"><tspan x="0" y="-7.5">硬约束不满足或未知？</tspan></text><text class="node-stage" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="0" y="22.5">不能用综合匹配分抵消</tspan></text></g>
<g id="bf-claims" class="node warning" transform="translate(600 710)" data-node-type="warning"><title>推断、冲突或不支持声明 — 确认、降级措辞或排除；绝不编造</title><rect class="node-shape" fill="#FFF0F0" stroke="#E06B6B" stroke-width="1.8" x="-125" y="-52" width="250" height="104" rx="10"/><text class="node-title" fill="#132238" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle"><tspan x="0" y="-7.5">推断、冲突或不支持声明</tspan></text><text class="node-stage" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="0" y="22.5">确认、降级措辞或排除；绝不编造</tspan></text></g>
