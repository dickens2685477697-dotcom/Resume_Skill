<g id="bre15" class="edge-group"><path class="edge" fill="none" stroke="#64748B" stroke-width="2" d="M 140 572 L 210 572 L 210 648 L 280 648" marker-end="url(#arrow)"/><text class="edge-label" x="210" y="598" fill="#334155" stroke="#FFFFFF" stroke-width="7" paint-order="stroke" stroke-linejoin="round" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="middle">是</text></g></g>
  <g id="nodes"><g id="br-input" class="node terminal" transform="translate(140 110)" data-node-type="terminal"><title>输入简历或个人材料 — 文本 / PDF / DOCX / 图片等</title><rect class="node-shape" fill="#E9F7EF" stroke="#67A77F" stroke-width="1.8" x="-120" y="-43" width="240" height="86" rx="43"/><text class="node-title" fill="#132238" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle"><tspan x="0" y="-16">输入简历或个人材料</tspan></text><text class="node-stage" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="0" y="14">文本 / PDF / DOCX / </tspan><tspan x="0" y="31">图片等</tspan></text></g>
<g id="br-mode" class="node process" transform="translate(460 110)" data-node-type="process"><title>设置 ingest 与运行清单 — 阶段 0 · 默认计划阶段 1–4</title><rect class="node-shape" fill="#E9F7EF" stroke="#67A77F" stroke-width="1.8" x="-125" y="-52" width="250" height="104" rx="10"/><text class="node-title" fill="#132238" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle"><tspan x="0" y="-19">设置 ingest </tspan><tspan x="0" y="4">与运行清单</tspan></text><text class="node-stage" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="0" y="34">阶段 0 · 默认计划阶段 1–4</tspan></text></g>
<g id="br-workspace" class="node process" transform="translate(780 110)" data-node-type="process"><title>初始化并校验 Workspace — 阶段 1 · 不覆盖已有文件</title><rect class="node-shape" fill="#E9F7EF" stroke="#67A77F" stroke-width="1.8" x="-125" y="-52" width="250" height="104" rx="10"/><text class="node-title" fill="#132238" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle"><tspan x="0" y="-19">初始化并校验 </tspan><tspan x="0" y="4">Workspace</tspan></text><text class="node-stage" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="0" y="34">阶段 1 · 不覆盖已有文件</tspan></text></g>
<g id="br-source" class="node process" transform="translate(1100 110)" data-node-type="process"><title>登记来源并提取文本 — 阶段 2 · source_id / 页码 / 段落</title><rect class="node-shape" fill="#E9F7EF" stroke="#67A77F" stroke-width="1.8" x="-125" y="-52" width="250" height="104" rx="10"/><text class="node-title" fill="#132238" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle"><tspan x="0" y="-16">登记来源并提取文本</tspan></text><text class="node-stage" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="0" y="14">阶段 2 · source_id / </tspan><tspan x="0" y="31">页码 / 段落</tspan></text></g>
<g id="br-normalize" class="node store" transform="translate(1100 510)" data-node-type="store"><title>规范化并标注证据状态 — 阶段 3 · verified / user_confirmed 可用</title><path class="node-shape" fill="#E8F1FF" stroke="#6F93C5" stroke-width="1.8" d="M -125 -41 C -125 -59, 125 -59, 125 -41 L 125 41 C 125 59, -125 59, -125 41 Z"/><path class="store-rim" fill="none" stroke="#6F93C5" stroke-width="1.4" d="M -125 -41 C -125 -23, 125 -23, 125 -41"/><text class="node-title" fill="#132238" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle"><tspan x="0" y="-16">规范化并标注证据状态</tspan></text><text class="node-stage" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="0" y="14">阶段 3 · verified / </tspan><tspan x="0" y="31">user_confirmed 可用</tspan></text></g>
<g id="br-audit" class="node process" transform="translate(780 510)" data-node-type="process"><title>STAR 与职责边界审计 — 阶段 4 · 区分目标/实际、个人/团队</title><rect class="node-shape" fill="#E9F7EF" stroke="#67A77F" stroke-width="1.8" x="-125" y="-52" width="250" height="104" rx="10"/><text class="node-title" fill="#132238" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle"><tspan x="0" y="-16">STAR 与职责边界审计</tspan></text><text class="node-stage" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="0" y="14">阶段 4 · 区分目标/实际、个人/</tspan><tspan x="0" y="31">团队</tspan></text></g>
<g id="br-report" class="node input" transform="translate(460 510)" data-node-type="input"><title>生成导入与完整性报告 — 仅提出少量高优先级事实问题</title><polygon class="node-shape" fill="#EAF3FF" stroke="#6F93C5" stroke-width="1.8" points="-101,-52 125,-52 101,52 -125,52"/><text class="node-title" fill="#132238" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle"><tspan x="0" y="-7.5">生成导入与完整性报告</tspan></text><text class="node-stage" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="0" y="22.5">仅提出少量高优先级事实问题</tspan></text></g>
<g id="br-next" class="node decision" transform="translate(140 510)" data-node-type="decision"><title>需要下游匹配或生成？ — 默认 ingest 在此结束</title><polygon class="node-shape" fill="#FFF2CC" stroke="#D6A64F" stroke-width="1.8" points="0,-62 120,0 0,62 -120,0"/><text class="node-title" fill="#132238" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle"><tspan x="0" y="-7.5">需要下游匹配或生成？</tspan></text><text class="node-stage" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="0" y="22.5">默认 ingest 在此结束</tspan></text></g>
<g id="br-readonly" class="node warning" transform="translate(280 310)" data-node-type="warning"><title>明确只分析、不保存 — 临时读取；不创建 Workspace</title><rect class="node-shape" fill="#FFF0F0" stroke="#E06B6B" stroke-width="1.8" x="-125" y="-52" width="250" height="104" rx="10"/><text class="node-title" fill="#132238" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle"><tspan x="0" y="-7.5">明确只分析、不保存</tspan></text><text class="node-stage" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="0" y="22.5">临时读取；不创建 Workspace</tspan></text></g>
<g id="br-noinput" class="node warning" transform="translate(600 310)" data-node-type="warning"><title>没有实际上传个人材料 — 不得凭空初始化或生成经历</title><rect class="node-shape" fill="#FFF0F0" stroke="#E06B6B" stroke-width="1.8" x="-125" y="-52" width="250" height="104" rx="10"/><text class="node-title" fill="#132238" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle"><tspan x="0" y="-7.5">没有实际上传个人材料</tspan></text><text class="node-stage" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="0" y="22.5">不得凭空初始化或生成经历</tspan></text></g>
<g id="br-wsfail" class="node warning" transform="translate(920 310)" data-node-type="warning"><title>结构不可写或校验失败 — 停止写入并报告具体错误</title><rect class="node-shape" fill="#FFF0F0" stroke="#E06B6B" stroke-width="1.8" x="-125" y="-52" width="250" height="104" rx="10"/><text class="node-title" fill="#132238" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle"><tspan x="0" y="-7.5">结构不可写或校验失败</tspan></text><text class="node-stage" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="0" y="22.5">停止写入并报告具体错误</tspan></text></g>
<g id="br-parse" class="node decision" transform="translate(1240 310)" data-node-type="decision"><title>解析结果：完整/部分/失败 — 失败不等于事实缺失；保留原因</title><polygon class="node-shape" fill="#FFF2CC" stroke="#D6A64F" stroke-width="1.8" points="0,-62 120,0 0,62 -120,0"/><text class="node-title" fill="#132238" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle"><tspan x="0" y="-19">解析结果：完整/部分/</tspan><tspan x="0" y="4">失败</tspan></text><text class="node-stage" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="0" y="34">失败不等于事实缺失；保留原因</tspan></text></g>
<g id="br-conflict" class="node warning" transform="translate(1240 710)" data-node-type="warning"><title>inferred / conflicting / unsupported — 不得进最终简历；missing 只问一次</title><rect class="node-shape" fill="#FFF0F0" stroke="#E06B6B" stroke-width="1.8" x="-125" y="-52" width="250" height="104" rx="10"/><text class="node-title" fill="#132238" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle"><tspan x="0" y="-27.5">inferred / </tspan><tspan x="0" y="-4.5">conflicting / u…</tspan></text><text class="node-stage" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="0" y="25.5">不得进最终简历；missing </tspan><tspan x="0" y="42.5">只问一次</tspan></text></g>
<g id="br-class" class="node decision" transform="translate(920 710)" data-node-type="decision"><title>完整性：完整/有缺口/不足 — 降级措辞或不建议写入简历</title><polygon class="node-shape" fill="#FFF2CC" stroke="#D6A64F" stroke-width="1.8" points="0,-62 120,0 0,62 -120,0"/><text class="node-title" fill="#132238" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle"><tspan x="0" y="-19">完整性：完整/有缺口/</tspan><tspan x="0" y="4">不足</tspan></text><text class="node-stage" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="0" y="34">降级措辞或不建议写入简历</tspan></text></g>
<g id="br-answer" class="node warning" transform="translate(600 710)" data-node-type="warning"><title>用户没有、不记得或无法确认 — 标为 missing_confirmed；停止重复询问</title><rect class="node-shape" fill="#FFF0F0" stroke="#E06B6B" stroke-width="1.8" x="-125" y="-52" width="250" height="104" rx="10"/><text class="node-title" fill="#132238" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle"><tspan x="0" y="-16">用户没有、不记得或无法确认</tspan></text><text class="node-stage" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="0" y="14">标为 missing_confirm</tspan><tspan x="0" y="31">ed；停止重复询问</tspan></text></g>
<g id="br-jd" class="node decision" transform="translate(280 710)" data-node-type="decision"><title>下游所需 JD 是否存在？ — 有→阶段7–11；无→请求JD并保留结果</title><polygon class="node-shape" fill="#FFF2CC" stroke="#D6A64F" stroke-width="1.8" points="0,-62 120,0 0,62 -120,0"/><text class="node-title" fill="#132238" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="middle"><tspan x="0" y="-27.5">下游所需 JD </tspan><tspan x="0" y="-4.5">是否存在？</tspan></text><text class="node-stage" fill="#475569" font-family="Inter, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle"><tspan x="0" y="25.5">有→阶段7–11；无→请求JD并保留</tspan><tspan x="0" y="42.5">结果</tspan></text></g></g>
</svg>
